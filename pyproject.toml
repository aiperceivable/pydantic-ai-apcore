[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-apcore"
version = "0.1.0"
description = "apcore integration for pydantic-ai: governed modules as agent tools, and agent tools as governed modules"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "aiperceivable", email = "team@aiperceivable.com" },
]
keywords = [
    "pydantic-ai",
    "apcore",
    "agent",
    "ai-agent",
    "llm",
    "tools",
    "tool-use",
    "toolset",
    "mcp",
    "governance",
    "access-control",
    "human-in-the-loop",
    "scanner",
    "integration",
]
dependencies = [
    "apcore>=0.26.0",
    "apcore-toolkit>=0.10.0",
    "pydantic-ai-slim>=1.32.0",
]

[project.optional-dependencies]
mcp = ["apcore-mcp>=0.17.2"]
cli = ["apcore-cli>=0.10.3"]
all = ["pydantic-ai-apcore[mcp,cli]"]
dev = [
    "apdev[dev]>=0.2.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_apcore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://aiperceivable.com"
Repository = "https://github.com/aiperceivable/pydantic-ai-apcore"
Documentation = "https://github.com/aiperceivable/pydantic-ai-apcore#readme"
Issues = "https://github.com/aiperceivable/pydantic-ai-apcore/issues"

[tool.ruff]
src = ["src"]
# requires-python is >=3.10 here, unlike the >=3.11 integrations in this ecosystem.
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's implicit default selection changes between
# releases (0.16 widened it from E4/E7/E9/F to a much larger set), which made CI
# fail on a newer ruff while an older local ruff passed. Widening the selection
# is a deliberate change, not a side effect of upgrading the linter.
select = ["E4", "E7", "E9", "F"]

[tool.apdev]
base_package = "pydantic_ai_apcore"
src_dir = "src"